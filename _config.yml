# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
lang: en-US
title: Anson Liu
email: anson@ansonliu.com
description: Software design, 3D printing, and outdoor adventures
baseurl: ""
url: "https://ansonliu.com"
author:
  name: Anson Liu
  url: https://ansonliu.com
  picture: https://avatars1.githubusercontent.com/ansonl?v=3&s=200
social:
  links:
    - https://github.com/ansonl
    - https://www.printables.com/@ansonl
    - https://www.linkedin.com/in/console/
    - https://www.facebook.com/ansonl
    - https://www.youtube.com/@maketheuncharted
    - https://www.instagram.com/maketheuncharted/
github_username: ansonl
printables_username: ansonl
makerworld_username: ansonl
linkedin_username: console
youtube_username: maketheuncharted
instagram_username: maketheuncharted
logo: # path of site logo, e.g. "/assets/images/logo.png"
search: true
search_full_content: false # true, false (default)
search_provider: lunr

#Custom settings
permalink: /:year/:month/:title/
# No analytics. The previous UA-55429613-1 property was Universal Analytics,
# which stopped collecting data in July 2023. Re-adding means a GA4 property
# and a fresh consent implementation.
disqus:
  shortname: apparentetch

# Newsletter signup (_includes/subscribe.html). Unset form_action to hide the form.
# Get the URL from Brevo: Contacts -> Forms -> Share -> the iframe src.
brevo:
  form_action: "https://65040f50.sibforms.com/serve/MUIFANPtYpdkDD-P1iGVw3TCuizWnR9kGkk8Nq27UG85SlSTf7PHxXLzozgG9at2TQ876HeILP3SP9llunZ6uue_pSG5GPtDSKTKaQKggiwHmunD5UhASAmFsk6U5px2TKa3ZR64L3IJfzvuQ-blmoFQAZv47AM60rAfrpn-wYBalwvGcvkCCoFCRUXJPc_C7IgbA3rkLPxs1w-A"
  heading: "Subscribe"
  blurb: "New posts on software design, 3D printing, and outdoor adventures."

# Build settings
markdown: kramdown
highlighter: rouge

#kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  auto_ids: true

# GitHub Pages builds in UTC; without this a local build emits your own offset
# and can never be diffed against production.
timezone: UTC

# Setting `exclude` REPLACES Jekyll's defaults rather than extending them, so
# the first seven entries restate them. Drop them and Gemfile ships to _site.
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - CNAME
  # Dev scripts; these were being served from the live site.
  - jekyllServe.sh
  - jekyllNginxServe.sh
  - rename-loop.sh

plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-gist

feed:
  path: atom.xml

# Pagination - https://jekyllrb.com/docs/pagination/
paginate: 5
paginate_path: /page:num/

# Collections
collections:
  maps:
    output: true
    permalink: /:collection/:path/
  store:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/


# Front Matter Defaults
defaults:
  # _posts
  - scope:
      path: "_posts"
      type: posts
    values:
      layout: post
      read_time: true
  - scope:
      path: "_drafts"
      type: drafts
    values:
      layout: post
      read_time: true

# Theme files come from upstream; only the handful in _includes/, _layouts/ and
# _sass/ in this repo override it. Do not set `theme:` as well -- remote_theme
# supplies it, and leaving it unset lets the github-pages gem default to
# jekyll-theme-primer, which silently ships its own stylesheet.
remote_theme: "mmistakes/jekyll-theme-basically-basic"